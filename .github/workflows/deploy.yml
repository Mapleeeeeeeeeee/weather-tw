name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: "Only build and deploy when CWA has new data (the Cloudflare cron Worker sets this)"
        type: boolean
        default: false
  schedule:
    # Fallback only: GitHub throttles and drops scheduled runs. The on-time trigger is the Cloudflare cron Worker in worker/.
    - cron: "17 * * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      # Scheduled and probe runs first ask CWA (one dataset) whether anything is new compared with the live site.
      - name: Probe CWA for new data
        id: probe
        if: github.event_name == 'schedule' || inputs.probe
        run: python3 scripts/build_snap.py --check
      # Fresh CWA data goes straight into the deployed index.html; it is not committed back.
      # The build refuses to write when the data looks wrong, which fails this job and keeps the live site as is.
      - name: Build weather snapshot
        if: steps.probe.outcome == 'skipped' || steps.probe.outputs.changed == 'true'
        run: python3 scripts/build_snap.py
      - name: Deploy
        if: steps.probe.outcome == 'skipped' || steps.probe.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=weather-tw --branch=main
