name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # CWA republishes the town forecasts every 3 hours (Taipei 02, 05, 08 ... 23); run 30 minutes after each
    - cron: "30 18,21,0,3,6,9,12,15 * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Fresh CWA data goes straight into the deployed index.html; it is not committed back.
      # The build refuses to write when the data looks wrong, which fails this job and keeps the live site as is.
      - name: Build weather snapshot
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python3 scripts/build_snap.py
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=weather-tw --branch=main
