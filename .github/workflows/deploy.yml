name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Probe CWA every 15 minutes, all day, at minutes that avoid the top of the hour (GitHub's busiest moment, when scheduled runs can be delayed or dropped).
    # A probe only costs one request; the real work (fetch, build, deploy) happens only when the data changed.
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      # Scheduled runs first ask CWA (one dataset) whether anything is new compared with the live site.
      - name: Probe CWA for new data
        id: probe
        if: github.event_name == 'schedule'
        run: python3 scripts/build_snap.py --check
      # Fresh CWA data goes straight into the deployed index.html; it is not committed back.
      # The build refuses to write when the data looks wrong, which fails this job and keeps the live site as is.
      - name: Build weather snapshot
        if: github.event_name != 'schedule' || steps.probe.outputs.changed == 'true'
        run: python3 scripts/build_snap.py
      - name: Deploy
        if: github.event_name != 'schedule' || steps.probe.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=weather-tw --branch=main
