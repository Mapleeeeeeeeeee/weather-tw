name = "weather-tw-cron"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cloudflare cron is on time (GitHub's `schedule` is throttled and often dropped), so this Worker is the clock:
# every 30 minutes it asks GitHub Actions to probe CWA and, only when the data changed, build and deploy.
# CWA publishes forecasts about every 3 hours, so 30 minutes is plenty.
[triggers]
crons = ["*/30 * * * *"]

[vars]
REPO = "Mapleeeeeeeeeee/weather-tw"
WORKFLOW = "deploy.yml"
REF = "main"
# secret: GITHUB_TOKEN  (fine-grained PAT, this repo only, "Actions: Read and write")
